<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VIX - Registro</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', sans-serif; }

    body {
      background: radial-gradient(circle at 50% 10%, #24190c 0%, #0d0a07 45%, #050403 100%);
      color: #f2e9d8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .wrap {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    /* Separador superior */
    .divider-poker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .linea-dorada {
      height: 1px;
      width: 45px;
      background: linear-gradient(90deg, transparent, #d4af37);
    }
    .linea-dorada.der {
      background: linear-gradient(90deg, #d4af37, transparent);
    }
    .pica-simbolo {
      color: #d4af37;
      font-size: 16px;
      text-shadow: 0 0 12px rgba(212, 175, 55, 0.8);
    }

    /* Logo VIX */
    .logo-vix {
      max-height: 58px;
      width: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto 18px auto;
      filter: drop-shadow(0 4px 15px rgba(0,0,0,0.6));
    }

    .titulo-selector {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 3.5px;
      color: #9a8871;
      margin-bottom: 14px;
      font-weight: 700;
    }

    /* Selector Glassmorphism & Metallic Gold */
    .selector-dias {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 8px;
    }

    .btn-dia {
      position: relative;
      background: linear-gradient(145deg, rgba(32, 25, 17, 0.75) 0%, rgba(12, 10, 7, 0.9) 100%);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 14px;
      padding: 18px 10px;
      cursor: pointer;
      outline: none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 
        0 10px 25px rgba(0, 0, 0, 0.7), 
        inset 0 1px 1px rgba(255, 255, 255, 0.15),
        inset 0 -1px 1px rgba(0, 0, 0, 0.5);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 3.5px;
      color: #e8dcc4;
      text-transform: uppercase;
      transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
      overflow: hidden;
    }

    /* Reflejo especular superior de cristal */
    .btn-dia::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.09) 0%, transparent 100%);
      pointer-events: none;
      border-radius: 13px 13px 0 0;
    }

    .btn-dia:active {
      transform: scale(0.97);
    }

    /* Estado Activo: Oro fundido + Resplandor Glow */
    .btn-dia.activo {
      background: linear-gradient(135deg, #f7e096 0%, #d4af37 50%, #9e7518 100%);
      color: #060402;
      border-color: #ffe8a3;
      box-shadow: 
        0 0 28px rgba(212, 175, 55, 0.6), 
        0 10px 25px rgba(0, 0, 0, 0.9),
        inset 0 1px 2px rgba(255, 255, 255, 0.65);
      transform: translateY(-2px);
      letter-spacing: 4px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .btn-dia.activo::before {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, transparent 100%);
    }

    /* Atenuación sutil del que no fue seleccionado */
    .selector-dias.con-seleccion .btn-dia:not(.activo) {
      opacity: 0.35;
      background: rgba(10, 8, 5, 0.6);
      border-color: rgba(212, 175, 55, 0.15);
      box-shadow: none;
      transform: none;
    }

    .error-dia {
      color: #ff5252;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 8px 0 14px 0;
      display: none;
      text-transform: uppercase;
    }

    /* Tarjeta de Formulario */
    .card {
      background: linear-gradient(160deg, rgba(20, 16, 11, 0.95) 0%, rgba(10, 8, 5, 0.98) 100%);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 20px;
      padding: 26px 20px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(212, 175, 55, 0.2);
      text-align: left;
      margin-top: 14px;
    }

    .card h2 {
      font-family: 'Cormorant Garamond', serif;
      color: #f2e9d8;
      font-size: 24px;
      margin-bottom: 18px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .campo {
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #a8947a;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .campo input {
      width: 100%;
      background: rgba(7, 5, 3, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 9px;
      padding: 13px 14px;
      color: #f2e9d8;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .campo input:focus {
      border-color: #d4af37;
      background: rgba(14, 10, 6, 0.95);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
    }

    /* Contador de amigos */
    .counter-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(7, 5, 3, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 9px;
      padding: 6px 14px;
      margin-top: 4px;
    }

    .counter-btn {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.5);
      color: #d4af37;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .counter-btn:active {
      transform: scale(0.92);
      background: #d4af37;
      color: #080604;
    }

    .counter-val {
      font-size: 16px;
      font-weight: 800;
      color: #f2e9d8;
    }

    /* Botón Submit */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #e6c86e 0%, #c99a2c 50%, #9c7316 100%);
      color: #0a0806;
      border: none;
      padding: 15px;
      border-radius: 9px;
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
      transition: all 0.25s;
    }

    .btn-submit:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }

    /* Pantalla Éxito */
    .success {
      display: none;
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>

  <div class="wrap">

    <div class="divider-poker">
      <span class="linea-dorada"></span>
      <span class="pica-simbolo">♠</span>
      <span class="linea-dorada der"></span>
    </div>

    <img src="logo.png" alt="VIX" class="logo-vix">

    <div class="titulo-selector">Seleccioná tu noche</div>

    <!-- Botones de Selección Estilizados -->
    <div class="selector-dias" id="contenedor-dias">
      <button type="button" class="btn-dia" id="btn-viernes">VIERNES</button>
      <button type="button" class="btn-dia" id="btn-sabado">SÁBADO</button>
    </div>

    <div class="error-dia" id="err-dia">⚠️ Por favor seleccioná Viernes o Sábado</div>

    <div class="card">
      
      <form id="form-registro">
        <h2>Solicitá tu invitación</h2>

        <div class="campo">
          <label>Nombre</label>
          <input type="text" id="nombre" required autocomplete="off">
        </div>

        <div class="campo">
          <label>Apellido</label>
          <input type="text" id="apellido" required autocomplete="off">
        </div>

        <div class="campo">
          <label>DNI</label>
          <input type="tel" id="dni" placeholder="Sin puntos" required autocomplete="off">
        </div>

        <div class="campo">
          <label>Celular</label>
          <input type="tel" id="celular" placeholder="Ej: 3624123456" required autocomplete="off">
        </div>

        <div class="campo">
          <label>Instagram (opcional)</label>
          <input type="text" id="instagram" placeholder="@usuario" autocomplete="off">
        </div>

        <div class="campo">
          <label>Cantidad de amigos</label>
          <div class="counter-box">
            <div class="counter-btn" id="btn-menos">-</div>
            <div class="counter-val" id="val-amigos">0</div>
            <div class="counter-btn" id="btn-mas">+</div>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-enviar">Generar mi invitación</button>
      </form>

      <div class="success" id="ok">
        <div style="font-size: 28px; color: #d4af37; margin-bottom: 12px; text-shadow: 0 0 12px rgba(212, 175, 55, 0.7);">♠</div>
        <h3 style="font-family: 'Cormorant Garamond', serif; font-size: 26px; color: #d4af37; margin-bottom: 8px; letter-spacing: 0.5px;">Tu invitación está confirmada</h3>
        <p style="color: #999083; font-size: 14px; margin-bottom: 22px;">Tu pase exclusivo ya se encuentra disponible.</p>
        
        <a id="btn-ver-pase" href="#" style="background: linear-gradient(135deg, #e6c86e 0%, #c99a2c 100%); color: #0a0806; padding: 14px 28px; border-radius: 9px; text-decoration: none; font-weight: 800; font-size: 13px; display: inline-block; letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 4px 18px rgba(212, 175, 55, 0.35);">
          VER MI PASE
        </a>
      </div>

    </div>

  </div>

<script>
  let diaSeleccionado = null;
  const contenedorDias = document.getElementById('contenedor-dias');
  const btnViernes = document.getElementById('btn-viernes');
  const btnSabado = document.getElementById('btn-sabado');
  const errDia = document.getElementById('err-dia');

  btnViernes.addEventListener('click', () => {
    diaSeleccionado = 'VIERNES';
    contenedorDias.classList.add('con-seleccion');
    btnViernes.classList.add('activo');
    btnSabado.classList.remove('activo');
    errDia.style.display = 'none';
  });

  btnSabado.addEventListener('click', () => {
    diaSeleccionado = 'SÁBADO';
    contenedorDias.classList.add('con-seleccion');
    btnSabado.classList.add('activo');
    btnViernes.classList.remove('activo');
    errDia.style.display = 'none';
  });

  let amigosCount = 0;
  const valAmigos = document.getElementById('val-amigos');
  const btnMenos = document.getElementById('btn-menos');
  const btnMas = document.getElementById('btn-mas');

  btnMenos.addEventListener('click', () => {
    if (amigosCount > 0) {
      amigosCount--;
      valAmigos.textContent = amigosCount;
    }
  });

  btnMas.addEventListener('click', () => {
    amigosCount++;
    valAmigos.textContent = amigosCount;
  });

  const form = document.getElementById('form-registro');
  const btnEnviar = document.getElementById('btn-enviar');
  const boxOk = document.getElementById('ok');
  const btnVerPase = document.getElementById('btn-ver-pase');

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    if (!diaSeleccionado) {
      errDia.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    const nombre = document.getElementById('nombre').value.trim();
    const apellido = document.getElementById('apellido').value.trim();
    const dni = document.getElementById('dni').value.trim();
    const celular = document.getElementById('celular').value.trim();
    const instagram = document.getElementById('instagram').value.trim();

    if (!nombre || !apellido || !dni || !celular) return;

    btnEnviar.disabled = true;
    btnEnviar.textContent = 'Generando...';

    fetch('/invitaciones', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nombre,
        apellido,
        dni,
        celular,
        instagram,
        amigos: amigosCount,
        dia: diaSeleccionado
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.ok) {
        form.style.display = 'none';
        btnVerPase.href = `/pase.html?id=${data.id}`;
        boxOk.style.display = 'block';
      } else {
        alert(data.error || 'Error al generar la invitación');
        btnEnviar.disabled = false;
        btnEnviar.textContent = 'Generar mi invitación';
      }
    })
    .catch(err => {
      console.error(err);
      alert('Error de conexión con el servidor');
      btnEnviar.disabled = false;
      btnEnviar.textContent = 'Generar mi invitación';
    });
  });
</script>
</body>
</html>
