<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de invitado</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* Separador con pica de póker */
  .divider-poker {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .linea-dorada {
    height: 1px;
    width: 45px;
    background: linear-gradient(90deg, transparent, #d4af37);
  }
  .linea-dorada.der {
    background: linear-gradient(90deg, #d4af37, transparent);
  }
  .pica-simbolo {
    color: #d4af37;
    font-size: 18px;
    line-height: 1;
    text-shadow: 0 0 6px rgba(212, 175, 55, 0.4);
  }

  /* Logo con filtro dorado */
  .logo-vix {
    max-height: 52px;
    width: auto;
    object-fit: contain;
    display: inline-block;
    filter: brightness(0) saturate(100%) invert(76%) sepia(31%) saturate(980%) hue-rotate(6deg) brightness(92%) contrast(87%) drop-shadow(0 0 8px rgba(212, 175, 55, 0.35));
  }

  /* Quitar el rombito por defecto de la tarjeta de éxito */
  .success::before {
    display: none !important;
    content: none !important;
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- Separador con la pica de póker ♠ -->
  <div class="divider-poker">
    <span class="linea-dorada"></span>
    <span class="pica-simbolo">♠</span>
    <span class="linea-dorada der"></span>
  </div>

  <!-- Logo oficial VIX -->
  <div style="text-align: center; margin-bottom: 6px;">
    <img src="logo.png" alt="VIX" class="logo-vix">
  </div>

  <p class="sub-title">Viernes 28.08</p>

  <div class="card" id="card">
    <form id="f">
      <h2>Solicitá tu invitación</h2>

      <div class="row">
        <div class="field" data-f="nombre"><label>Nombre</label><input name="nombre"><span class="err">Requerido</span></div>
        <div class="field" data-f="apellido"><label>Apellido</label><input name="apellido"><span class="err">Requerido</span></div>
      </div>

      <div class="field" data-f="dni"><label>DNI</label><input name="dni" inputmode="numeric"><span class="err">DNI inválido</span></div>
      <div class="field" data-f="celular"><label>Celular</label><input name="celular" inputmode="tel"><span class="err">Celular inválido</span></div>
      <div class="field"><label>Instagram (opcional)</label><input name="instagram"></div>

      <label>Cantidad de amigos</label>
      <div class="stepper">
        <button type="button" id="menos">−</button>
        <span id="cant">0</span>
        <button type="button" id="mas">+</button>
      </div>

      <button type="submit">Generar mi invitación</button>
    </form>

    <div class="success" id="ok">
      <div style="font-size: 26px; color: #d4af37; margin-bottom: 12px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);">♠</div>
      <h3 style="font-family: 'Cormorant Garamond', serif; font-size: 26px; color: #d4af37; margin-bottom: 8px; letter-spacing: 0.5px;">Tu invitación está confirmada</h3>
      <p style="color: #999083; font-size: 14px; margin-bottom: 22px;">Tu pase exclusivo ya se encuentra disponible.</p>
      
      <a id="btn-ver-pase" href="#" style="background: #d4af37; color: #0a0806; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: 800; font-size: 13px; display: inline-block; letter-spacing: 1.5px; text-transform: uppercase; box-shadow: 0 4px 18px rgba(212, 175, 55, 0.35);">
        VER MI PASE QR
      </a>
    </div>

<script src="script.js"></script>
</body>
</html>
