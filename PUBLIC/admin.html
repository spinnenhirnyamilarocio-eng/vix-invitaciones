<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel Admin - VIX</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', sans-serif; }

    body {
      background: radial-gradient(circle at 50% 12%, #420d1b 0%, #1e050c 50%, #0a0104 100%);
      color: #f2e9d8;
      min-height: 100vh;
      padding: 16px 12px 40px 12px;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto;
    }

    /* Encabezado */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      height: 42px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.6));
    }

    .header-text h1 {
      font-family: 'Cormorant Garamond', serif;
      color: #d4af37;
      font-size: 24px;
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .header-text p {
      font-size: 11px;
      color: #c4a98a;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .header-botones {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .btn-actualizar {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-actualizar:active {
      transform: scale(0.96);
      background: #d4af37;
      color: #1a0309;
    }

    .btn-excel {
      background: rgba(46, 204, 113, 0.15);
      border: 1px solid #2ecc71;
      color: #2ecc71;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-excel:active {
      transform: scale(0.96);
      background: #2ecc71;
      color: #080604;
    }

    /* Selector de Fin de Semana */
    .selector-semana-box {
      background: linear-gradient(160deg, rgba(46, 11, 20, 0.95) 0%, rgba(20, 4, 9, 0.98) 100%);
      border: 1.5px solid rgba(212, 175, 55, 0.45);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
    }

    .selector-semana-box label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #d4af37;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .select-semana {
      background: rgba(15, 3, 6, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #f2e9d8;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      min-width: 250px;
    }
    .select-semana:focus {
      border-color: #d4af37;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    /* Pestañas de Noche */
    .tabs-noche {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: rgba(25, 5, 11, 0.7);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #c4a98a;
      padding: 12px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .tab-btn span.cant {
      font-size: 14px;
      font-weight: 800;
      color: #f2e9d8;
    }

    .tab-btn.activo {
      background: linear-gradient(135deg, #e6c86e 0%, #c99a2c 100%);
      color: #1a0309;
      border-color: #f5df97;
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.4);
    }

    .tab-btn.activo span.cant {
      color: #1a0309;
    }

    /* Métricas */
    .metricas-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    @media(min-width: 768px) {
      .metricas-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .card-metrica {
      background: linear-gradient(160deg, rgba(38, 8, 16, 0.85) 0%, rgba(16, 3, 7, 0.95) 100%);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }
    .card-metrica .num {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }
    .card-metrica .txt {
      font-size: 10px;
      color: #c4a98a;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .num.dorado { color: #d4af37; }
    .num.verde { color: #2ecc71; }
    .num.rojo { color: #e74c3c; }
    .num.blanco { color: #f2e9d8; }

    /* Buscador y Filtros */
    .filtros-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    @media(min-width: 600px) {
      .filtros-box { flex-direction: row; }
    }

    .input-buscar, .select-estado {
      background: rgba(15, 3, 6, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #f2e9d8;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 13px;
      outline: none;
    }
    .input-buscar { flex: 1; }
    .select-estado { min-width: 160px; }
    .input-buscar:focus, .select-estado:focus {
      border-color: #d4af37;
      background: rgba(26, 5, 11, 0.95);
    }

    /* Tabla */
    .tabla-card {
      background: linear-gradient(160deg, rgba(38, 8, 16, 0.92) 0%, rgba(16, 3, 7, 0.98) 100%);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8);
    }

    .tabla-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: rgba(24, 5, 10, 0.95);
      color: #d4af37;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 14px 14px;
      font-weight: 700;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    }

    td {
      padding: 13px 14px;
      font-size: 13px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.08);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    .nombre-titular {
      font-weight: 700;
      color: #f2e9d8;
    }
    .id-sub {
      font-size: 10px;
      color: #c4a98a;
      font-family: monospace;
    }

    .badge-noche {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid #d4af37;
      color: #d4af37;
    }

    .badge-estado {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .badge-estado.pendiente {
      background: rgba(46, 204, 113, 0.1);
      border: 1px solid #2ecc71;
      color: #2ecc71;
    }
    .badge-estado.completado {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid #e74c3c;
      color: #e74c3c;
    }

    .btn-wsp {
      background: #25D366;
      color: #080604;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-transform: uppercase;
    }
    .btn-wsp:active {
      transform: scale(0.95);
      background: #1ebc59;
    }

    .aviso-scroll {
      font-size: 11px;
      color: #c4a98a;
      text-align: right;
      padding: 6px 4px;
      display: block;
    }
    @media(min-width: 768px) {
      .aviso-scroll { display: none; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="header">
      <div class="header-brand">
        <img src="logo.png" alt="VIX" class="logo-img">
        <div class="header-text">
          <h1>Panel Control</h1>
          <p>Gestión de Invitaciones</p>
        </div>
      </div>

      <div class="header-botones">
        <button class="btn-actualizar" id="btn-refrescar">↻ Actualizar</button>
        <button class="btn-excel" id="btn-excel">📥 Descargar Excel</button>
      </div>
    </div>

    <div class="selector-semana-box">
      <label for="selector-fin-semana">📅 Período de Evento:</label>
      <select id="selector-fin-semana" class="select-semana">
        </select>
    </div>

    <div class="tabs-noche">
      <button type="button" class="tab-btn activo" data-dia="todos" id="tab-todos">
        <span>TODOS</span>
        <span class="cant" id="cant-tab-todos">0</span>
      </button>
      <button type="button" class="tab-btn" data-dia="VIERNES" id="tab-viernes">
        <span>VIERNES</span>
        <span class="cant" id="cant-tab-viernes">0</span>
      </button>
      <button type="button" class="tab-btn" data-dia="SÁBADO" id="tab-sabado">
        <span>SÁBADO</span>
        <span class="cant" id="cant-tab-sabado">0</span>
      </button>
    </div>

    <div class="metricas-grid">
      <div class="card-metrica">
        <div class="num dorado" id="m-total-personas">0</div>
        <div class="txt">Total Personas</div>
      </div>
      <div class="card-metrica">
        <div class="num verde" id="m-ingresaron">0</div>
        <div class="txt">Ingresaron</div>
      </div>
      <div class="card-metrica">
        <div class="num rojo" id="m-restantes">0</div>
        <div class="txt">Restantes</div>
      </div>
      <div class="card-metrica">
        <div class="num blanco" id="m-invitaciones">0</div>
        <div class="txt">Total Pases</div>
      </div>
    </div>

    <div class="filtros-box">
      <input type="text" id="buscar" class="input-buscar" placeholder="Buscar por Nombre, DNI o Celular...">
      <select id="filtro-estado" class="select-estado">
        <option value="todos">Todos los estados</option>
        <option value="pendiente">Pendientes</option>
        <option value="completado">Completados</option>
      </select>
    </div>

    <span class="aviso-scroll">⇄ Deslizá horizontalmente para ver más columnas</span>

    <div class="tabla-card">
      <div class="tabla-responsive">
        <table>
          <thead>
            <tr>
              <th>Titular</th>
              <th>Noche</th>
              <th>Contacto</th>
              <th>Pases</th>
              <th>Ingreso</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr>
              <td colspan="7" style="text-align: center; color: #c4a98a; padding: 24px;">Cargando datos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

<script>
  let listaOriginal = [];
  let filtroNocheActivo = 'todos';
  let finSemanaSeleccionado = '';

  function obtenerFinDeSemanaActual() {
    const d = new Date();
    const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
    const fechaArg = new Date(utc - (3 * 3600000));
    const fechaAjustada = new Date(fechaArg.getTime() - (6 * 3600000));
    const diaSemana = fechaAjustada.getDay();

    let diasHastaViernes = 5 - diaSemana;
    if (diaSemana === 0) diasHastaViernes = 5;

    const viernes = new Date(fechaAjustada);
    viernes.setDate(fechaAjustada.getDate() + diasHastaViernes);

    const sabado = new Date(viernes);
    sabado.setDate(viernes.getDate() + 1);

    const pad = n => n.toString().padStart(2, '0');
    return `${pad(viernes.getDate())}/${pad(viernes.getMonth() + 1)} - ${pad(sabado.getDate())}/${pad(sabado.getMonth() + 1)}/${sabado.getFullYear()}`;
  }

  function limpiarNumeroWhatsApp(tel) {
    if (!tel) return '';
    let num = tel.toString().replace(/[^0-9]/g, '');
    if (num.startsWith('0')) num = num.substring(1);
    if (num.startsWith('549')) return num;
    if (num.startsWith('54')) return '549' + num.substring(2);
    return '549' + num;
  }

  function normalizarDia(evento) {
    if (!evento) return 'VIERNES';
    const txt = evento.toString().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    if (txt.includes('SAB')) return 'SÁBADO';
    return 'VIERNES';
  }

  function cargarDatos() {
    fetch('/invitaciones')
      .then(res => res.json())
      .then(data => {
        listaOriginal = Array.isArray(data) ? data : (data.invitaciones || []);
        construirSelectorFinde();
        aplicarFiltros();
      })
      .catch(err => {
        console.error(err);
        document.getElementById('tabla-body').innerHTML = '<tr><td colspan="7" style="text-align: center; color: #e74c3c;">Error de conexión</td></tr>';
      });
  }

  function construirSelectorFinde() {
    const selector = document.getElementById('selector-fin-semana');
    const valorPrevio = selector.value;
    const actual = obtenerFinDeSemanaActual();

    // Obtener todos los fines de semana registrados
    const setFindes = new Set();
    setFindes.add(actual);
    listaOriginal.forEach(i => {
      if (i.fin_semana) setFindes.add(i.fin_semana);
    });

    const findesOrdenados = Array.from(setFindes);

    selector.innerHTML = '';

    // Opción actual
    const optActual = document.createElement('option');
    optActual.value = actual;
    optActual.textContent = `📍 Este Fin de Semana (${actual})`;
    selector.appendChild(optActual);

    // Fines de semana anteriores
    findesOrdenados.forEach(f => {
      if (f !== actual) {
        const opt = document.createElement('option');
        opt.value = f;
        opt.textContent = `🗓️ Fin de Semana: ${f}`;
        selector.appendChild(opt);
      }
    });

    // Opción histórico completo
    const optTodos = document.createElement('option');
    optTodos.value = 'todos';
    optTodos.textContent = `🌐 Histórico Completo (Todos los registros)`;
    selector.appendChild(optTodos);

    if (valorPrevio && Array.from(selector.options).some(o => o.value === valorPrevio)) {
      selector.value = valorPrevio;
    } else {
      selector.value = actual;
    }
    finSemanaSeleccionado = selector.value;
  }

  function obtenerSublistaPorSemana() {
    if (finSemanaSeleccionado === 'todos') {
      return listaOriginal;
    }
    return listaOriginal.filter(i => (i.fin_semana || '') === finSemanaSeleccionado);
  }

  function actualizarContadoresPestanas(invsSemana) {
    let cantViernes = 0;
    let cantSabado = 0;

    invsSemana.forEach(i => {
      const dia = normalizarDia(i.evento);
      if (dia === 'SÁBADO') cantSabado++;
      else cantViernes++;
    });

    document.getElementById('cant-tab-todos').textContent = invsSemana.length;
    document.getElementById('cant-tab-viernes').textContent = cantViernes;
    document.getElementById('cant-tab-sabado').textContent = cantSabado;
  }

  function actualizarMetricas(invs) {
    let totalPersonas = 0;
    let ingresaron = 0;

    invs.forEach(i => {
      totalPersonas += Number(i.autorizadas) || 1;
      ingresaron += Number(i.ingresadas) || 0;
    });

    document.getElementById('m-total-personas').textContent = totalPersonas;
    document.getElementById('m-ingresaron').textContent = ingresaron;
    document.getElementById('m-restantes').textContent = Math.max(totalPersonas - ingresaron, 0);
    document.getElementById('m-invitaciones').textContent = invs.length;
  }

  function aplicarFiltros() {
    const invsSemana = obtenerSublistaPorSemana();
    actualizarContadoresPestanas(invsSemana);

    const busqueda = document.getElementById('buscar').value.toLowerCase().trim();
    const filtroEstado = document.getElementById('filtro-estado').value;

    const filtradas = invsSemana.filter(i => {
      const diaInvitacion = normalizarDia(i.evento);

      if (filtroNocheActivo !== 'todos' && diaInvitacion !== filtroNocheActivo) {
        return false;
      }

      const restantes = (Number(i.autorizadas) || 1) - (Number(i.ingresadas) || 0);
      const estado = restantes <= 0 ? 'completado' : 'pendiente';
      if (filtroEstado !== 'todos' && filtroEstado !== estado) {
        return false;
      }

      const nombreCompleto = `${i.titular_nombre || ''} ${i.titular_apellido || ''}`.toLowerCase();
      const dni = (i.titular_dni || i.dni || '').toString().toLowerCase();
      const cel = (i.titular_celular || i.celular || i.telefono || '').toString().toLowerCase();
      const ig = (i.instagram || '').toString().toLowerCase();

      return nombreCompleto.includes(busqueda) || dni.includes(busqueda) || cel.includes(busqueda) || ig.includes(busqueda);
    });

    actualizarMetricas(filtradas);
    renderTabla(filtradas);
  }

  function renderTabla(invs) {
    const tbody = document.getElementById('tabla-body');

    if (invs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #c4a98a; padding: 22px;">No hay registros cargados para este período</td></tr>';
      return;
    }

    tbody.innerHTML = invs.map(i => {
      const dia = normalizarDia(i.evento);
      const autorizadas = Number(i.autorizadas) || 1;
      const ingresadas = Number(i.ingresadas) || 0;
      const restantes = autorizadas - ingresadas;
      const esCompletado = restantes <= 0;
      const estadoClase = esCompletado ? 'completado' : 'pendiente';
      const estadoTexto = esCompletado ? 'COMPLETADO' : 'PENDIENTE';

      const tel = i.titular_celular || i.celular || i.telefono || '';
      const celFormateado = limpiarNumeroWhatsApp(tel);
      const linkPase = `https://vix-invitaciones.onrender.com/pase.html?id=${i.id}`;
      const textoWsp = encodeURIComponent(`Hola ${i.titular_nombre}! ♠ Acá tenés tu pase para VIX (${dia}):\n\n🎟️ ${linkPase}\n\nPresentá el código QR en el ingreso.`);
      const linkWsp = `https://wa.me/${celFormateado}?text=${textoWsp}`;

      return `
        <tr>
          <td>
            <div class="nombre-titular">${i.titular_nombre} ${i.titular_apellido}</div>
            <div class="id-sub">ID: ${i.id}</div>
          </td>
          <td><span class="badge-noche">${dia}</span></td>
          <td>
            <div style="font-size: 12px; color: #f2e9d8;">${tel || '—'}</div>
            <div style="font-size: 11px; color: #d4af37;">${i.instagram ? '@' + i.instagram.replace('@','') : ''}</div>
          </td>
          <td><b>${autorizadas}</b> <span style="font-size: 10px; color: #c4a98a;">pers.</span></td>
          <td>${ingresadas} / ${autorizadas}</td>
          <td><span class="badge-estado ${estadoClase}">${estadoTexto}</span></td>
          <td>
            <a href="${linkWsp}" target="_blank" class="btn-wsp">WhatsApp 📲</a>
          </td>
        </tr>
      `;
    }).join('');
  }

  // Cambio de período (Fin de semana)
  document.getElementById('selector-fin-semana').addEventListener('change', (e) => {
    finSemanaSeleccionado = e.target.value;
    aplicarFiltros();
  });

  // Pestañas Noche
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('activo'));
      btn.classList.add('activo');
      filtroNocheActivo = btn.getAttribute('data-dia');
      aplicarFiltros();
    });
  });

  // Exportar a Excel
  function descargarExcel() {
    const listaAExportar = obtenerSublistaPorSemana();
    if (!listaAExportar || listaAExportar.length === 0) {
      alert('No hay registros en el período seleccionado para exportar.');
      return;
    }

    let csv = '\uFEFFsep=;\n';
    csv += 'ID Pase;Fin de Semana;Noche;Nombre;Apellido;DNI;Celular;Instagram;Invitados Extras;Total Personas;Ingresaron;Restantes;Estado;Fecha Registro\n';

    listaAExportar.forEach(i => {
      const id = (i.id || '').toString().replace(/"/g, '""');
      const finde = (i.fin_semana || '').toString().replace(/"/g, '""');
      const dia = normalizarDia(i.evento);
      const nombre = (i.titular_nombre || '').toString().replace(/"/g, '""');
      const apellido = (i.titular_apellido || '').toString().replace(/"/g, '""');
      const dni = (i.titular_dni || i.dni || '').toString().replace(/"/g, '""');
      const celular = (i.titular_celular || i.celular || i.telefono || '').toString().replace(/"/g, '""');
      const ig = (i.instagram || '').toString().replace(/"/g, '""');

      const autorizadas = Number(i.autorizadas) || 1;
      const extras = autorizadas > 1 ? autorizadas - 1 : 0;
      const ingresadas = Number(i.ingresadas) || 0;
      const restantes = Math.max(autorizadas - ingresadas, 0);
      const estado = restantes <= 0 ? 'COMPLETADO' : 'PENDIENTE';
      const fecha = i.fecha ? new Date(i.fecha).toLocaleString('es-AR') : '-';

      csv += `"${id}";"${finde}";"${dia}";"${nombre}";"${apellido}";"${dni}";"${celular}";"${ig}";"${extras}";"${autorizadas}";"${ingresadas}";"${restantes}";"${estado}";"${fecha}"\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const etiquetaArchivo = finSemanaSeleccionado === 'todos' ? 'historico_completo' : finSemanaSeleccionado.replace(/[\/\s-]/g, '_');

    a.href = url;
    a.setAttribute('download', `invitados_vix_${etiquetaArchivo}.csv`);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById('buscar').addEventListener('input', aplicarFiltros);
  document.getElementById('filtro-estado').addEventListener('change', aplicarFiltros);
  document.getElementById('btn-refrescar').addEventListener('click', cargarDatos);
  document.getElementById('btn-excel').addEventListener('click', descargarExcel);

  cargarDatos();
</script>
</body>
</html>
