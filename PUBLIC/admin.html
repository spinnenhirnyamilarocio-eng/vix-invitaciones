<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel Admin - VIX</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', sans-serif; }

    body {
      background: #080604;
      color: #f2e9d8;
      min-height: 100vh;
      padding: 16px 12px 40px 12px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Encabezado */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .header-title h1 {
      font-family: 'Cormorant Garamond', serif;
      color: #d4af37;
      font-size: 26px;
      letter-spacing: 1px;
      line-height: 1;
    }
    .header-title p {
      font-size: 12px;
      color: #887e70;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }

    .btn-actualizar {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }
    .btn-actualizar:active {
      transform: scale(0.96);
      background: #d4af37;
      color: #080604;
    }

    /* Métricas / Contadores */
    .metricas-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    @media(min-width: 768px) {
      .metricas-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .card-metrica {
      background: #14100b;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
    }
    .card-metrica .num {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }
    .card-metrica .txt {
      font-size: 10px;
      color: #887e70;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .num.dorado { color: #d4af37; }
    .num.verde { color: #2ecc71; }
    .num.rojo { color: #e74c3c; }
    .num.blanco { color: #f2e9d8; }

    /* Filtros y Buscador */
    .filtros-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    @media(min-width: 600px) {
      .filtros-box { flex-direction: row; }
    }

    .input-buscar, .select-estado {
      background: #14100b;
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #f2e9d8;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .input-buscar { flex: 1; }
    .select-estado { min-width: 140px; }
    .input-buscar:focus, .select-estado:focus {
      border-color: #d4af37;
    }

    /* Tabla Responsiva */
    .tabla-card {
      background: #14100b;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 14px;
      overflow: hidden;
    }

    .tabla-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #1b1610;
      color: #d4af37;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 12px 14px;
      font-weight: 700;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    td {
      padding: 12px 14px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    .nombre-titular {
      font-weight: 700;
      color: #f2e9d8;
    }
    .id-sub {
      font-size: 10px;
      color: #887e70;
      font-family: monospace;
    }

    /* Badges */
    .badge-estado {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .badge-estado.pendiente {
      background: rgba(46, 204, 113, 0.1);
      border: 1px solid #2ecc71;
      color: #2ecc71;
    }
    .badge-estado.completado {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid #e74c3c;
      color: #e74c3c;
    }

    /* Botón WhatsApp */
    .btn-wsp {
      background: #25D366;
      color: #080604;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-transform: uppercase;
    }
    .btn-wsp:active {
      transform: scale(0.95);
      background: #1ebc59;
    }

    .aviso-scroll {
      font-size: 11px;
      color: #887e70;
      text-align: right;
      padding: 8px 12px;
      display: block;
    }
    @media(min-width: 768px) {
      .aviso-scroll { display: none; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Header -->
    <div class="header">
      <div class="header-title">
        <h1>VIX • Control</h1>
        <p>Viernes 28.08</p>
      </div>
      <button class="btn-actualizar" id="btn-refrescar">↻ Actualizar</button>
    </div>

    <!-- Métricas -->
    <div class="metricas-grid">
      <div class="card-metrica">
        <div class="num dorado" id="m-total-personas">0</div>
        <div class="txt">Total Personas</div>
      </div>
      <div class="card-metrica">
        <div class="num verde" id="m-ingresaron">0</div>
        <div class="txt">Ingresaron</div>
      </div>
      <div class="card-metrica">
        <div class="num rojo" id="m-restantes">0</div>
        <div class="txt">Restantes</div>
      </div>
      <div class="card-metrica">
        <div class="num blanco" id="m-invitaciones">0</div>
        <div class="txt">Total Pases</div>
      </div>
    </div>

    <!-- Buscador y Filtros -->
    <div class="filtros-box">
      <input type="text" id="buscar" class="input-buscar" placeholder="Buscar por Nombre, DNI o Celular...">
      <select id="filtro-estado" class="select-estado">
        <option value="todos">Todos los estados</option>
        <option value="pendiente">Pendientes</option>
        <option value="completado">Completados</option>
      </select>
    </div>

    <span class="aviso-scroll">⇄ Deslizá para ver más datos</span>

    <!-- Tabla -->
    <div class="tabla-card">
      <div class="tabla-responsive">
        <table>
          <thead>
            <tr>
              <th>Titular</th>
              <th>Contacto</th>
              <th>Pases</th>
              <th>Ingreso</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr>
              <td colspan="6" style="text-align: center; color: #887e70; padding: 24px;">Cargando datos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

<script>
  let listaOriginal = [];

  // Función para adaptar cualquier número al formato internacional de WhatsApp (+54 9 ...)
  function limpiarNumeroWhatsApp(tel) {
    if (!tel) return '';
    let num = tel.toString().replace(/[^0-9]/g, '');

    // Si empieza con 0 (ej: 03624...), le quitamos el 0 inicial
    if (num.startsWith('0')) {
      num = num.substring(1);
    }

    // Si ya tiene el prefijo 549 completo
    if (num.startsWith('549')) {
      return num;
    }

    // Si empieza con 54 pero le falta el 9 (ej: 54362...)
    if (num.startsWith('54')) {
      return '549' + num.substring(2);
    }

    // Si le sacaron el 15 o es número local de 10 dígitos (ej: 3624123456 o 1123456789)
    return '549' + num;
  }

  function cargarDatos() {
    fetch('/invitaciones')
      .then(res => res.json())
      .then(data => {
        listaOriginal = Array.isArray(data) ? data : (data.invitaciones || []);
        actualizarMetricas(listaOriginal);
        renderTabla(listaOriginal);
      })
      .catch(err => {
        console.error(err);
        document.getElementById('tabla-body').innerHTML = '<tr><td colspan="6" style="text-align: center; color: #e74c3c;">Error al cargar las invitaciones</td></tr>';
      });
  }

  function actualizarMetricas(invs) {
    let totalPersonas = 0;
    let ingresaron = 0;

    invs.forEach(i => {
      totalPersonas += Number(i.autorizadas) || 1;
      ingresaron += Number(i.ingresadas) || 0;
    });

    document.getElementById('m-total-personas').textContent = totalPersonas;
    document.getElementById('m-ingresaron').textContent = ingresaron;
    document.getElementById('m-restantes').textContent = Math.max(totalPersonas - ingresaron, 0);
    document.getElementById('m-invitaciones').textContent = invs.length;
  }

  function renderTabla(invs) {
    const tbody = document.getElementById('tabla-body');
    const busqueda = document.getElementById('buscar').value.toLowerCase().trim();
    const filtro = document.getElementById('filtro-estado').value;

    const filtradas = invs.filter(i => {
      const nombreCompleto = `${i.titular_nombre || ''} ${i.titular_apellido || ''}`.toLowerCase();
      const dni = (i.dni || '').toString().toLowerCase();
      const cel = (i.telefono || '').toString().toLowerCase();
      const ig = (i.instagram || '').toString().toLowerCase();
      
      const coincideTexto = nombreCompleto.includes(busqueda) || dni.includes(busqueda) || cel.includes(busqueda) || ig.includes(busqueda);
      
      const restantes = (i.autorizadas || 1) - (i.ingresadas || 0);
      const estado = restantes <= 0 ? 'completado' : 'pendiente';

      const coincideEstado = filtro === 'todos' || filtro === estado;

      return coincideTexto && coincideEstado;
    });

    if (filtradas.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #887e70; padding: 20px;">No se encontraron resultados</td></tr>';
      return;
    }

    tbody.innerHTML = filtradas.map(i => {
      const restantes = (i.autorizadas || 1) - (i.ingresadas || 0);
      const esCompletado = restantes <= 0;
      const estadoClase = esCompletado ? 'completado' : 'pendiente';
      const estadoTexto = esCompletado ? 'COMPLETADO' : 'PENDIENTE';

      // Enlace directo al pase del invitado
      const linkPase = `https://vix-invitaciones.onrender.com/pase.html?id=${i.id}`;
      const textoWsp = encodeURIComponent(`Hola ${i.titular_nombre}! ♠ Acá tenés tu pase VIP exclusivo para VIX:\n\n🎟️ ${linkPase}\n\nPresentá el código QR en el ingreso.`);
      
      const celFormateado = limpiarNumeroWhatsApp(i.telefono);
      const linkWsp = `https://wa.me/${celFormateado}?text=${textoWsp}`;

      return `
        <tr>
          <td>
            <div class="nombre-titular">${i.titular_nombre} ${i.titular_apellido}</div>
            <div class="id-sub">ID: ${i.id}</div>
          </td>
          <td>
            <div style="font-size: 12px; color: #887e70;">${i.telefono || '—'}</div>
            <div style="font-size: 11px; color: #d4af37;">${i.instagram ? '@' + i.instagram.replace('@','') : ''}</div>
          </td>
          <td><b>${i.autorizadas || 1}</b> <span style="font-size: 10px; color: #887e70;">pers.</span></td>
          <td>${i.ingresadas || 0} / ${i.autorizadas || 1}</td>
          <td><span class="badge-estado ${estadoClase}">${estadoTexto}</span></td>
          <td>
            <a href="${linkWsp}" target="_blank" class="btn-wsp">WhatsApp 📲</a>
          </td>
        </tr>
      `;
    }).join('');
  }

  document.getElementById('buscar').addEventListener('input', () => renderTabla(listaOriginal));
  document.getElementById('filtro-estado').addEventListener('change', () => renderTabla(listaOriginal));
  document.getElementById('btn-refrescar').addEventListener('click', cargarDatos);

  // Carga inicial
  cargarDatos();
</script>
</body>
</html>
