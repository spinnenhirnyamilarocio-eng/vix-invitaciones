<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel Admin - VIX</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', sans-serif; }

    body {
      background: #080604;
      color: #f2e9d8;
      min-height: 100vh;
      padding: 16px 12px 40px 12px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Encabezado */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }

    .header-text h1 {
      font-family: 'Cormorant Garamond', serif;
      color: #d4af37;
      font-size: 22px;
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .header-text p {
      font-size: 11px;
      color: #887e70;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .header-botones {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .btn-actualizar {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-actualizar:active {
      transform: scale(0.96);
      background: #d4af37;
      color: #080604;
    }

    .btn-excel {
      background: rgba(46, 204, 113, 0.15);
      border: 1px solid #2ecc71;
      color: #2ecc71;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-excel:active {
      transform: scale(0.96);
      background: #2ecc71;
      color: #080604;
    }

    .btn-vaciar {
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid #e74c3c;
      color: #e74c3c;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-vaciar:active {
      transform: scale(0.96);
      background: #e74c3c;
      color: #ffffff;
    }

    /* Métricas */
    .metricas-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    @media(min-width: 768px) {
      .metricas-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .card-metrica {
      background: #14100b;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
    }
    .card-metrica .num {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }
    .card-metrica .txt {
      font-size: 10px;
      color: #887e70;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .num.dorado { color: #d4af37; }
    .num.verde { color: #2ecc71; }
    .num.rojo { color: #e74c3c; }
    .num.blanco { color: #f2e9d8; }

    /* Buscador y Filtros */
    .filtros-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    @media(min-width: 600px) {
      .filtros-box { flex-direction: row; }
    }

    .input-buscar, .select-estado {
      background: #14100b;
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #f2e9d8;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .input-buscar { flex: 1; }
    .select-estado { min-width: 150px; }
    .input-buscar:focus, .select-estado:focus {
      border-color: #d4af37;
    }

    /* Tabla Responsiva */
    .tabla-card {
      background: #14100b;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 14px;
      overflow: hidden;
    }

    .tabla-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #1b1610;
      color: #d4af37;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 12px 14px;
      font-weight: 700;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    td {
      padding: 12px 14px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    .nombre-titular {
      font-weight: 700;
      color: #f2e9d8;
    }
    .id-sub {
      font-size: 10px;
      color: #887e70;
      font-family: monospace;
    }

    .badge-estado {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .badge-estado.pendiente {
      background: rgba(46, 204, 113, 0.1);
      border: 1px solid #2ecc71;
      color: #2ecc71;
    }
    .badge-estado.completado {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid #e74c3c;
      color: #e74c3c;
    }

    .btn-wsp {
      background: #25D366;
      color: #080604;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-transform: uppercase;
    }
    .btn-wsp:active {
      transform: scale(0.95);
      background: #1ebc59;
    }

    .aviso-scroll {
      font-size: 11px;
      color: #887e70;
      text-align: right;
      padding: 6px 4px;
      display: block;
    }
    @media(min-width: 768px) {
      .aviso-scroll { display: none; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Encabezado con logo y botones -->
    <div class="header">
      <div class="header-brand">
        <img src="logo.png" alt="VIX" class="logo-img">
        <div class="header-text">
          <h1>Panel Control</h1>
          <p>SABADO 29.08</p>
        </div>
      </div>

      <div class="header-botones">
        <button class="btn-actualizar" id="btn-refrescar">↻ Actualizar</button>
        <button class="btn-excel" id="btn-excel">📥 Descargar Excel</button>
        <button class="btn-vaciar" id="btn-vaciar">🗑️ Vaciar Lista</button>
      </div>
    </div>

    <!-- Tarjetas de Métricas -->
    <div class="metricas-grid">
      <div class="card-metrica">
        <div class="num dorado" id="m-total-personas">0</div>
        <div class="txt">Total Personas</div>
      </div>
      <div class="card-metrica">
        <div class="num verde" id="m-ingresaron">0</div>
        <div class="txt">Ingresaron</div>
      </div>
      <div class="card-metrica">
        <div class="num rojo" id="m-restantes">0</div>
        <div class="txt">Restantes</div>
      </div>
      <div class="card-metrica">
        <div class="num blanco" id="m-invitaciones">0</div>
        <div class="txt">Total Pases</div>
      </div>
    </div>

    <!-- Buscador y Filtros -->
    <div class="filtros-box">
      <input type="text" id="buscar" class="input-buscar" placeholder="Buscar por Nombre, DNI o Celular...">
      <select id="filtro-estado" class="select-estado">
        <option value="todos">Todos los estados</option>
        <option value="pendiente">Pendientes</option>
        <option value="completado">Completados</option>
      </select>
    </div>

    <span class="aviso-scroll">⇄ Deslizá horizontalmente para ver más columnas</span>

    <!-- Tabla -->
    <div class="tabla-card">
      <div class="tabla-responsive">
        <table>
          <thead>
            <tr>
              <th>Titular</th>
              <th>Contacto</th>
              <th>Pases</th>
              <th>Ingreso</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr>
              <td colspan="6" style="text-align: center; color: #887e70; padding: 24px;">Cargando datos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

<script>
  let listaOriginal = [];

  function limpiarNumeroWhatsApp(tel) {
    if (!tel) return '';
    let num = tel.toString().replace(/[^0-9]/g, '');

    if (num.startsWith('0')) {
      num = num.substring(1);
    }
    if (num.startsWith('549')) {
      return num;
    }
    if (num.startsWith('54')) {
      return '549' + num.substring(2);
    }
    return '549' + num;
  }

  function cargarDatos() {
    fetch('/invitaciones')
      .then(res => res.json())
      .then(data => {
        listaOriginal = Array.isArray(data) ? data : (data.invitaciones || []);
        actualizarMetricas(listaOriginal);
        renderTabla(listaOriginal);
      })
      .catch(err => {
        console.error(err);
        document.getElementById('tabla-body').innerHTML = '<tr><td colspan="6" style="text-align: center; color: #e74c3c;">Error de conexión</td></tr>';
      });
  }

  function actualizarMetricas(invs) {
    let totalPersonas = 0;
    let ingresaron = 0;

    invs.forEach(i => {
      totalPersonas += Number(i.autorizadas) || 1;
      ingresaron += Number(i.ingresadas) || 0;
    });

    document.getElementById('m-total-personas').textContent = totalPersonas;
    document.getElementById('m-ingresaron').textContent = ingresaron;
    document.getElementById('m-restantes').textContent = Math.max(totalPersonas - ingresaron, 0);
    document.getElementById('m-invitaciones').textContent = invs.length;
  }

  function renderTabla(invs) {
    const tbody = document.getElementById('tabla-body');
    const busqueda = document.getElementById('buscar').value.toLowerCase().trim();
    const filtro = document.getElementById('filtro-estado').value;

    const filtradas = invs.filter(i => {
      const nombreCompleto = `${i.titular_nombre || ''} ${i.titular_apellido || ''}`.toLowerCase();
      const dni = (i.titular_dni || i.dni || '').toString().toLowerCase();
      const cel = (i.titular_celular || i.celular || i.telefono || '').toString().toLowerCase();
      const ig = (i.instagram || '').toString().toLowerCase();
      
      const coincideTexto = nombreCompleto.includes(busqueda) || dni.includes(busqueda) || cel.includes(busqueda) || ig.includes(busqueda);
      
      const restantes = (Number(i.autorizadas) || 1) - (Number(i.ingresadas) || 0);
      const estado = restantes <= 0 ? 'completado' : 'pendiente';

      const coincideEstado = filtro === 'todos' || filtro === estado;

      return coincideTexto && coincideEstado;
    });

    if (filtradas.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #887e70; padding: 20px;">No hay registros cargados</td></tr>';
      return;
    }

    tbody.innerHTML = filtradas.map(i => {
      const autorizadas = Number(i.autorizadas) || 1;
      const ingresadas = Number(i.ingresadas) || 0;
      const restantes = autorizadas - ingresadas;
      const esCompletado = restantes <= 0;
      const estadoClase = esCompletado ? 'completado' : 'pendiente';
      const estadoTexto = esCompletado ? 'COMPLETADO' : 'PENDIENTE';

      const tel = i.titular_celular || i.celular || i.telefono || '';
      const celFormateado = limpiarNumeroWhatsApp(tel);
      const linkPase = `https://vix-invitaciones.onrender.com/pase.html?id=${i.id}`;
      const textoWsp = encodeURIComponent(`Hola ${i.titular_nombre}! ♠ Acá tenés tu pase VIP exclusivo para VIX:\n\n🎟️ ${linkPase}\n\nPresentá el código QR en el ingreso.`);
      const linkWsp = `https://wa.me/${celFormateado}?text=${textoWsp}`;

      return `
        <tr>
          <td>
            <div class="nombre-titular">${i.titular_nombre} ${i.titular_apellido}</div>
            <div class="id-sub">ID: ${i.id}</div>
          </td>
          <td>
            <div style="font-size: 12px; color: #f2e9d8;">${tel || '—'}</div>
            <div style="font-size: 11px; color: #d4af37;">${i.instagram ? '@' + i.instagram.replace('@','') : ''}</div>
          </td>
          <td><b>${autorizadas}</b> <span style="font-size: 10px; color: #887e70;">pers.</span></td>
          <td>${ingresadas} / ${autorizadas}</td>
          <td><span class="badge-estado ${estadoClase}">${estadoTexto}</span></td>
          <td>
            <a href="${linkWsp}" target="_blank" class="btn-wsp">WhatsApp 📲</a>
          </td>
        </tr>
      `;
    }).join('');
  }

  // Exportar base de datos a Excel (CSV con separador punto y coma)
  function descargarExcel() {
    if (!listaOriginal || listaOriginal.length === 0) {
      alert('No hay registros cargados para exportar.');
      return;
    }

    // \uFEFF para UTF-8 y sep=; para forzar la separación en columnas en Excel
    let csv = '\uFEFFsep=;\n';
    csv += 'ID Pase;Nombre;Apellido;DNI;Celular;Instagram;Invitados Extras;Total Personas;Ingresaron;Restantes;Estado;Fecha Registro\n';

    listaOriginal.forEach(i => {
      const id = (i.id || '').toString().replace(/"/g, '""');
      const nombre = (i.titular_nombre || '').toString().replace(/"/g, '""');
      const apellido = (i.titular_apellido || '').toString().replace(/"/g, '""');
      const dni = (i.titular_dni || i.dni || '').toString().replace(/"/g, '""');
      const celular = (i.titular_celular || i.celular || i.telefono || '').toString().replace(/"/g, '""');
      const ig = (i.instagram || '').toString().replace(/"/g, '""');

      const autorizadas = Number(i.autorizadas) || 1;
      const extras = autorizadas > 1 ? autorizadas - 1 : 0;
      const ingresadas = Number(i.ingresadas) || 0;
      const restantes = Math.max(autorizadas - ingresadas, 0);
      const estado = restantes <= 0 ? 'COMPLETADO' : 'PENDIENTE';
      const fecha = i.fecha ? new Date(i.fecha).toLocaleString('es-AR') : '-';

      csv += `"${id}";"${nombre}";"${apellido}";"${dni}";"${celular}";"${ig}";"${extras}";"${autorizadas}";"${ingresadas}";"${restantes}";"${estado}";"${fecha}"\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const hoy = new Date().toISOString().slice(0, 10);

    a.href = url;
    a.setAttribute('download', `invitados_vix_${hoy}.csv`);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Botón Vaciar Lista con confirmación
  document.getElementById('btn-vaciar').addEventListener('click', () => {
    const confirmacion = confirm('⚠️ ¿Estás seguro de que querés borrar TODAS las invitaciones y dejar la lista en 0?');
    if (!confirmacion) return;

    fetch('/invitaciones/limpiar-todo', { method: 'POST' })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          cargarDatos();
        } else {
          alert('Error al vaciar la lista.');
        }
      })
      .catch(err => {
        console.error(err);
        alert('Error de conexión.');
      });
  });

  document.getElementById('buscar').addEventListener('input', () => renderTabla(listaOriginal));
  document.getElementById('filtro-estado').addEventListener('change', () => renderTabla(listaOriginal));
  document.getElementById('btn-refrescar').addEventListener('click', cargarDatos);
  document.getElementById('btn-excel').addEventListener('click', descargarExcel);

  // Carga inicial
  cargarDatos();
</script>
</body>
</html>
