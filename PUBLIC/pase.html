<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pase VIP - VIX</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', sans-serif; }
    
    body {
      background: radial-gradient(circle at 50% 15%, #1a140d 0%, #080604 100%);
      color: #f2e9d8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    /* Tarjeta Ticket VIP Completa */
    .ticket {
      position: relative;
      background: linear-gradient(145deg, #16120d 0%, #0d0a07 100%);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 20px;
      padding: 28px 20px;
      max-width: 350px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(212, 175, 55, 0.15);
    }

    /* Pica y Separador superior */
    .divider-poker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .linea-dorada {
      height: 1px;
      width: 40px;
      background: linear-gradient(90deg, transparent, #d4af37);
    }
    .linea-dorada.der {
      background: linear-gradient(90deg, #d4af37, transparent);
    }
    .pica-simbolo {
      color: #d4af37;
      font-size: 18px;
      line-height: 1;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
    }

    /* Logo VIX */
    .logo-vix {
      max-height: 48px;
      width: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto 4px auto;
      filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4));
    }

    .sub-title {
      color: #887e70;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .badge-vip {
      display: inline-block;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.5);
      color: #d4af37;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 4px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* Contenedor QR */
    .qr-wrapper {
      background: #ffffff;
      padding: 12px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 16px;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
    }
    #qrcode img {
      display: block;
    }

    .linea-corte {
      border-top: 1px dashed rgba(212, 175, 55, 0.25);
      margin: 16px 0;
    }

    .titular-nombre {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 700;
      color: #f2e9d8;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .pases-badge {
      display: inline-block;
      color: #d4af37;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .id-codigo {
      font-family: monospace;
      color: #887e70;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .aviso-puerta {
      font-size: 10px;
      color: #70675a;
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Botón de Descarga */
    #btn-descargar {
      margin-top: 20px;
      background: #d4af37;
      color: #0a0806;
      border: none;
      padding: 13px 26px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: none;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
      transition: transform 0.15s ease;
    }
    #btn-descargar:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <!-- Tarjeta Pase VIP Completo -->
  <div class="ticket" id="tarjeta-pase">
    <div class="divider-poker">
      <span class="linea-dorada"></span>
      <span class="pica-simbolo">♠</span>
      <span class="linea-dorada der"></span>
    </div>

    <img src="logo.png" alt="VIX" class="logo-vix" id="img-logo">
    <p class="sub-title">Viernes 28.08</p>

    <div><span class="badge-vip">Pase Exclusivo</span></div>

    <div class="qr-wrapper">
      <div id="qrcode"></div>
    </div>

    <div class="linea-corte"></div>

    <div>
      <div class="titular-nombre" id="titular">Cargando...</div>
      <div class="pases-badge" id="pases"></div>
      <div class="id-codigo" id="codigo"></div>
      <div class="aviso-puerta">Presentar este pase digital en el ingreso</div>
    </div>
  </div>

  <!-- Botón de Descarga -->
  <button id="btn-descargar">📥 Descargar Pase</button>

<script>
  // Teñir el logo a dorado directamente en memoria para que se descargue dorado
  function convertirLogoDorado() {
    const logo = document.getElementById('img-logo');
    const tmpImg = new Image();
    tmpImg.src = 'logo.png';
    tmpImg.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = tmpImg.naturalWidth || 400;
      canvas.height = tmpImg.naturalHeight || 200;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(tmpImg, 0, 0);
      ctx.globalCompositeOperation = 'source-in';
      ctx.fillStyle = '#d4af37';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      logo.src = canvas.toDataURL();
    };
  }
  convertirLogoDorado();

  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');

  if (!id) {
    document.querySelector('.ticket').innerHTML = '<p style="color:#ff5252; padding: 20px;">Pase inválido o no encontrado</p>';
  } else {
    fetch(`/invitaciones/${id}`)
      .then(res => res.json())
      .then(inv => {
        document.getElementById('titular').textContent = `${inv.titular_nombre} ${inv.titular_apellido}`;
        document.getElementById('pases').textContent = `Válido para ${inv.autorizadas} persona(s)`;
        document.getElementById('codigo').textContent = `ID: ${inv.id}`;
        
        new QRCode(document.getElementById('qrcode'), {
          text: inv.id,
          width: 165,
          height: 165,
          correctLevel: QRCode.CorrectLevel.H
        });

        const btnDescargar = document.getElementById('btn-descargar');
        btnDescargar.style.display = 'block';
        
        // Descarga de la tarjeta completa
        btnDescargar.onclick = () => {
          btnDescargar.textContent = 'Guardando...';
          
          html2canvas(document.getElementById('tarjeta-pase'), {
            backgroundColor: '#0a0806',
            scale: 3,
            useCORS: true
          }).then(canvas => {
            const enlace = document.createElement('a');
            enlace.download = `Pase_VIX_${inv.titular_nombre}_${inv.titular_apellido}.png`;
            enlace.href = canvas.toDataURL('image/png');
            document.body.appendChild(enlace);
            enlace.click();
            document.body.removeChild(enlace);
            btnDescargar.textContent = '📥 Descargar Pase';
          }).catch(err => {
            console.error('Error al generar la imagen:', err);
            btnDescargar.textContent = '📥 Descargar Pase';
          });
        };
      })
      .catch(() => {
        document.getElementById('titular').textContent = 'Error al cargar pase';
      });
  }
</script>
</body>
</html>
