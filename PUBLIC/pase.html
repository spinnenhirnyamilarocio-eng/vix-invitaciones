<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pase - VIX</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', sans-serif; }
    
    body {
      background: radial-gradient(circle at 50% 12%, #420d1b 0%, #1e050c 50%, #0a0104 100%);
      color: #f2e9d8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    /* Pica y Separador superior */
    .divider-poker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .linea-dorada {
      height: 1px;
      width: 40px;
      background: linear-gradient(90deg, transparent, #d4af37);
    }
    .linea-dorada.der {
      background: linear-gradient(90deg, #d4af37, transparent);
    }
    .pica-simbolo {
      color: #d4af37;
      font-size: 18px;
      line-height: 1;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
    }

    /* Logo VIX */
    .logo-vix {
      max-height: 50px;
      width: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto 6px auto;
      filter: brightness(0) saturate(100%) invert(76%) sepia(31%) saturate(980%) hue-rotate(6deg) brightness(92%) contrast(87%) drop-shadow(0 0 10px rgba(212, 175, 55, 0.45));
      -webkit-filter: brightness(0) saturate(100%) invert(76%) sepia(31%) saturate(980%) hue-rotate(6deg) brightness(92%) contrast(87%) drop-shadow(0 0 10px rgba(212, 175, 55, 0.45));
    }

    /* Día dinámico (VIERNES / SÁBADO) */
    .sub-title {
      color: #d4af37;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
      min-height: 18px;
    }

    /* Tarjeta Ticket Burdeos */
    .ticket {
      position: relative;
      background: linear-gradient(145deg, #2b0812 0%, #140307 100%);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 20px;
      padding: 28px 20px;
      max-width: 350px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(212, 175, 55, 0.15);
    }

    /* Muescas laterales adaptadas al fondo bordeaux */
    .ticket::before, .ticket::after {
      content: '';
      position: absolute;
      top: 60%;
      width: 22px;
      height: 22px;
      background: #0a0104;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.45);
    }
    .ticket::before { left: -12px; }
    .ticket::after { right: -12px; }

    .badge-vip {
      display: inline-block;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.5);
      color: #d4af37;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 4px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* Contenedor QR */
    .qr-wrapper {
      background: #ffffff;
      padding: 12px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 16px;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
    }
    #qrcode img {
      display: block;
    }

    .linea-corte {
      border-top: 1px dashed rgba(212, 175, 55, 0.25);
      margin: 16px 0;
    }

    .titular-nombre {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 700;
      color: #f2e9d8;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .pases-badge {
      display: inline-block;
      color: #d4af37;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .id-codigo {
      font-family: monospace;
      color: #c4a98a;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .aviso-puerta {
      font-size: 10px;
      color: #9c836a;
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Botón de Descarga */
    #btn-descargar {
      margin-top: 20px;
      background: linear-gradient(135deg, #e6c86e 0%, #c99a2c 100%);
      color: #1a0309;
      border: none;
      padding: 14px 28px;
      border-radius: 9px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: none;
      box-shadow: 0 4px 18px rgba(212, 175, 55, 0.35);
    }
  </style>
</head>
<body>

  <div class="ticket" id="tarjeta-pase">
    <div class="divider-poker">
      <span class="linea-dorada"></span>
      <span class="pica-simbolo">♠</span>
      <span class="linea-dorada der"></span>
    </div>

    <img src="logo.png" alt="VIX" class="logo-vix">
    
    <p class="sub-title" id="dia-evento"></p>

    <div><span class="badge-vip">Pase Exclusivo</span></div>

    <div class="qr-wrapper">
      <div id="qrcode"></div>
    </div>

    <div class="linea-corte"></div>

    <div>
      <div class="titular-nombre" id="titular">Cargando...</div>
      <div class="pases-badge" id="pases"></div>
      <div class="id-codigo" id="codigo"></div>
      <div class="aviso-puerta">Presentar este pase digital en el ingreso</div>
    </div>
  </div>

  <button id="btn-descargar">📥 Descargar Pase</button>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');

  if (!id) {
    document.querySelector('.ticket').innerHTML = '<p style="color:#ff5252; padding: 20px;">Pase inválido o no encontrado</p>';
  } else {
    fetch(`/invitaciones/${id}`)
      .then(res => res.json())
      .then(inv => {
        const diaTexto = (inv.evento || 'VIERNES').toUpperCase();
        document.getElementById('dia-evento').textContent = diaTexto;

        document.getElementById('titular').textContent = `${inv.titular_nombre} ${inv.titular_apellido}`;
        document.getElementById('pases').textContent = `Válido para ${inv.autorizadas} persona(s)`;
        document.getElementById('codigo').textContent = `ID: ${inv.id}`;
        
        new QRCode(document.getElementById('qrcode'), {
          text: inv.id,
          width: 165,
          height: 165,
          correctLevel: QRCode.CorrectLevel.H
        });

        const btnDescargar = document.getElementById('btn-descargar');
        btnDescargar.style.display = 'block';
        
        btnDescargar.onclick = () => {
          btnDescargar.textContent = 'Guardando...';
          
          html2canvas(document.getElementById('tarjeta-pase'), {
            backgroundColor: '#140307',
            scale: 3,
            useCORS: true
          }).then(canvas => {
            const enlace = document.createElement('a');
            enlace.download = `Pase_VIX_${diaTexto}_${inv.titular_nombre}_${inv.titular_apellido}.png`;
            enlace.href = canvas.toDataURL('image/png');
            document.body.appendChild(enlace);
            enlace.click();
            document.body.removeChild(enlace);
            btnDescargar.textContent = '📥 Descargar Pase';
          }).catch(err => {
            console.error('Error al generar la imagen:', err);
            btnDescargar.textContent = '📥 Descargar Pase';
          });
        };
      })
      .catch(() => {
        document.getElementById('titular').textContent = 'Error al cargar pase';
      });
  }
</script>
</body>
</html>
