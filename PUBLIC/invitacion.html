<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi invitación</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="invitacion.css">
</head>
<body>
<div class="wrap">

  <div class="ornament"><span></span><i></i><span class="r"></span></div>
  <h1>VIX</h1>
  <p class="sub-title">Invitación digital</p>

  <div class="ticket">
    <span class="tipo">Invitación especial</span>

    <h2 id="nombre">Juan Pérez</h2>

    <div class="datos">
      <div>
        <span class="label">Fecha</span>
        <span class="valor" id="fecha">Viernes 28.08</span>
      </div>
      <div>
        <span class="label">Invitados</span>
        <span class="valor" id="cantidad">+4</span>
      </div>
    </div>

    <div class="perforado"></div>

    <div class="qr-box">
      <div id="qrcode"></div>
    </div>

    <span class="estado" id="estado">Válida</span>
  </div>

  <p class="foot-note">Presentá esta pantalla en la puerta. No la compartas fuera de tu grupo.</p>
<a id="btn-whatsapp" class="btn-wa" target="_blank">
  📲 Compartir por WhatsApp
</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="invitacion.js"></script>
</body>
</html>
